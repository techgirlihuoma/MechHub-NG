<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t='light';try{t=localStorage.getItem('mechhub-theme')||'light'}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources — MechHub NG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body data-page="resources">

  <div id="site-nav"></div>

  <main>
    <section class="page-head">
      <div class="wrap">
        <span class="eyebrow">The aisle</span>
        <h1>Best resources handpicked for you (most are free!)</h1>
        <p>Everything from awesome YouTube channels to great books, free websites, and mind-blowing software you may not have known existed until now.</p>
        <div class="seg" role="tablist" aria-label="Resource types" style="margin-top:24px">
          <button class="seg-btn" role="tab" id="tab-books" aria-selected="true" aria-controls="panel-books" data-type="books">Books</button>
          <button class="seg-btn" role="tab" id="tab-software" aria-selected="false" aria-controls="panel-software" data-type="software">Software</button>
          <button class="seg-btn" role="tab" id="tab-websites" aria-selected="false" aria-controls="panel-websites" data-type="websites">Websites</button>
          <button class="seg-btn" role="tab" id="tab-videos" aria-selected="false" aria-controls="panel-videos" data-type="videos">Videos</button>
        </div>
      </div>
    </section>

    <div class="wrap main-pad">
      <div class="tab-panel" id="panel-books" role="tabpanel"><div class="grid-cards" id="grid-books"><div class="state" style="grid-column:1/-1">Loading…</div></div></div>
      <div class="tab-panel" id="panel-software" role="tabpanel" hidden><div class="grid-cards" id="grid-software"></div></div>
      <div class="tab-panel" id="panel-websites" role="tabpanel" hidden><div class="grid-cards" id="grid-websites"></div></div>
      <div class="tab-panel" id="panel-videos" role="tabpanel" hidden><div class="grid-cards" id="grid-videos"></div></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/sanity.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/common.js"></script>
  <script src="js/resources.js"></script>
</body>
</html>
